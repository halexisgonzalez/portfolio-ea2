<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Portfolio Académico de Electrónica Aplicada II</title>
    <meta
      name="description"
      content="Trabajos Finales Integradores de Electrónica Aplicada II desarrollados por estudiantes a través de distintas cohortes académicas."
    />
    <meta name="theme-color" content="#080d1c" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <script type="text/javascript">
      // Applies the saved theme before the first paint, so a light-theme user
      // never sees a flash of the dark default. Keep the key in sync with ThemeToggle.
      (function () {
        try {
          var theme = localStorage.getItem('portfolio-ea2:theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Portfolio Académico de Electrónica Aplicada II" />
    <meta
      property="og:description"
      content="Trabajos Finales Integradores de Electrónica Aplicada II desarrollados por estudiantes a través de distintas cohortes académicas."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Portfolio Académico de Electrónica Aplicada II" />
    <meta
      name="twitter:description"
      content="Trabajos Finales Integradores de Electrónica Aplicada II desarrollados por estudiantes a través de distintas cohortes académicas."
    />

    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so deep links (e.g. /students/juan-perez)
      // get redirected to 404.html, which forwards here with the path encoded in the query
      // string. This decodes it back into a real history entry before React Router mounts.
      // See: https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
